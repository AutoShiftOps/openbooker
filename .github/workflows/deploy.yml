name: Deploy to Firebase
# Runs after a merge to master. The `production` environment should have
# "Required reviewers" set (Settings -> Environments), so every deploy to
# Asha's live app waits for a human click. Can also be run by hand.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      only:
        description: "firebase --only targets"
        default: "functions,firestore:rules,hosting"

concurrency: firebase-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        run: npx --yes firebase-tools@13 deploy --project samakeovers-7326f --only "${{ github.event.inputs.only || 'functions,firestore:rules,hosting' }}" --non-interactive
